<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="robots" content="noindex,nofollow">
  <link rel="preload" as="image" href="https://movilios.com/abrir-en-navegador.gif?v=4" type="image/gif">
  <title>Abrir en el navegador</title>

  <script>
    (function(){
      "use strict";
      // TU ENLACE OFICIAL CONFIGURADO AQUÍ:
      var destination = "https://yorbax.segurosvida.site/";
      
      var ua = navigator.userAgent || navigator.vendor || "";
      var inApp = /TikTok|musical_ly|BytedanceWebview|ByteDance|aweme|trill|TTWebView|FBAN|FBAV|Instagram|Messenger|Snapchat|Twitter|Pinterest|Telegram|WhatsApp|Line\//i.test(ua) || /;\s*wv\)/i.test(ua) || /\bwv\b/i.test(ua) || (/Android/i.test(ua) && /Version\/[\d.]+.*Chrome\/[\d.]+.*Mobile Safari/i.test(ua)) || (/iPhone|iPad|iPod/i.test(ua) && /AppleWebKit/i.test(ua) && !/Safari/i.test(ua));
      
      document.documentElement.className = inApp ? "in-app" : "external";
      
      // Si ya abrió en Chrome o Safari, lo manda directo a https://yorbax.segurosvida.site/
      if (!inApp) {
        try {
          location.replace(destination);
        } catch(e) {
          location.href = destination;
        }
      }
    })();
  </script>

  <style>
    :root {
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --soft: #f1f5f9;
      --blue: #2563eb;
      --cyan: #06b6d4;
      --green: #10b981;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: #e2e8f0;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    html.external body { visibility: hidden; }
    html.in-app body { visibility: visible; }
    
    .shell {
      width: min(100%, 430px);
      min-height: 100vh;
      min-height: 100dvh;
      margin: auto;
      padding: env(safe-area-inset-top) 17px calc(20px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      box-shadow: 0 0 45px rgba(15, 23, 42, .12);
    }
    .topbar {
      height: 57px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }
    .secure {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12.5px;
      font-weight: 750;
    }
    .secure svg {
      width: 18px;
      height: 18px;
      fill: var(--green);
    }
    .detected {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--soft);
      color: #475569;
      font-size: 10px;
      font-weight: 850;
      text-transform: uppercase;
    }
    .detected::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
    }
    .hero {
      text-align: center;
      padding: 18px 6px 14px;
    }
    .brand-icon {
      width: 44px;
      height: 44px;
      margin: 0 auto 10px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--blue), var(--cyan));
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 22px;
      box-shadow: 0 8px 16px rgba(37, 99, 235, .25);
    }
    h1 {
      margin: 0;
      font-size: 23px;
      line-height: 1.15;
      font-weight: 850;
      letter-spacing: -.5px;
    }
    .subtitle {
      margin: 8px auto 0;
      color: var(--muted);
      font-size: 13.5px;
      line-height: 1.4;
      font-weight: 500;
    }
    .demo {
      position: relative;
      width: 100%;
      aspect-ratio: 1/1;
      border: 2px solid #cbd5e1;
      border-radius: 21px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 13px 32px rgba(15, 23, 42, .12);
    }
    .demo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
    }
    .live {
      position: absolute;
      left: 11px;
      top: 11px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(15, 23, 42, .82);
      color: #fff;
      font-size: 9.5px;
      font-weight: 850;
      backdrop-filter: blur(8px);
    }
    .live::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, .22);
    }
    .gif-fallback {
      display: none;
      width: 100%;
      height: 100%;
      place-items: center;
      text-align: center;
      background: linear-gradient(145deg, #f8faff, #edf3fb);
    }
    .gif-fallback.show { display: grid; }
    .fallback-arrow {
      font-size: 45px;
      line-height: 1;
      color: var(--blue);
      animation: nudge 1s ease-in-out infinite;
    }
    .fallback-menu {
      font-size: 41px;
      font-weight: 900;
      letter-spacing: 4px;
    }
    .gif-fallback strong {
      display: block;
      margin-top: 7px;
      font-size: 13px;
    }
    .corner-cue {
      position: fixed;
      z-index: 20;
      right: max(13px, env(safe-area-inset-right));
      top: max(7px, env(safe-area-inset-top));
      display: flex;
      align-items: center;
      gap: 5px;
      pointer-events: none;
      filter: drop-shadow(0 3px 8px rgba(15, 23, 42, .28));
      animation: nudge 1s ease-in-out infinite;
    }
    .corner-cue span {
      padding: 7px 10px;
      border-radius: 999px;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #fff;
      font-size: 9.5px;
      font-weight: 900;
      white-space: nowrap;
    }
    .corner-cue svg {
      width: 32px;
      height: 32px;
      fill: none;
      stroke: #dc2626;
      stroke-width: 2.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      transform: rotate(-16deg);
    }
    @keyframes nudge {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .steps {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 13px;
    }
    .step {
      min-height: 71px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: #fff;
      box-shadow: 0 4px 13px rgba(15, 23, 42, .04);
    }
    .number {
      flex: 0 0 29px;
      width: 29px;
      height: 29px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--blue), var(--cyan));
      color: #fff;
      font-size: 12px;
      font-weight: 850;
    }
    .step strong {
      display: block;
      font-size: 12px;
      line-height: 1.22;
    }
    .step span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.2;
    }
    .waiting {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 14px;
      padding: 12px;
      border: 1px solid #bfdbfe;
      border-radius: 14px;
      background: #eff6ff;
      color: var(--blue);
      font-size: 11.5px;
      font-weight: 750;
    }
    .spinner {
      width: 15px;
      height: 15px;
      border: 2px solid #93c5fd;
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin .85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .redirect-fallback {
      display: none;
      min-height: 100dvh;
      align-items: center;
      justify-content: center;
      padding: 28px;
      text-align: center;
      background: #fff;
    }
    .redirect-fallback a {
      display: inline-block;
      margin-top: 15px;
      padding: 13px 24px;
      border-radius: 12px;
      background: var(--blue);
      color: #fff;
      text-decoration: none;
      font-weight: 800;
    }
    @media(max-width:350px) {
      .shell { padding-left: 12px; padding-right: 12px; }
      .steps { grid-template-columns: 1fr; }
      .hero { padding-top: 14px; }
      .demo { border-radius: 17px; }
    }
  </style>
</head>
<body>
  <div class="corner-cue" aria-hidden="true">
    <span data-i18n="tapHere">PULSA AQUÍ</span>
    <svg viewBox="0 0 40 40"><path d="M5 31C16 29 25 21 31 8M22 10l9-2 2 9"/></svg>
  </div>

  <!-- Respaldo automático si entra desde navegador normal -->
  <div class="redirect-fallback" id="redirectFallback">
    <div>
      <strong>Redirigiendo…</strong><br>
      <a href="https://yorbax.segurosvida.site/">Continuar al sitio</a>
    </div>
  </div>

  <main class="shell" id="guide">
    <header class="topbar">
      <div class="secure">
        <svg viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5.2 3.4 9.8 8 11 4.6-1.2 8-5.8 8-11V5l-8-3Zm-1.1 14.3-3.2-3.2 1.4-1.4 1.8 1.8 4.2-4.2 1.4 1.4-5.6 5.6Z"/></svg>
        <span data-i18n="secure">Conexión segura</span>
      </div>
      <div class="detected"><span id="languageName">Español</span></div>
    </header>

    <section class="hero">
      <div class="brand-icon">💎</div>
      <h1 data-i18n="title">Pulsa ••• y abre en navegador</h1>
      <p class="subtitle" id="subtitle">Selecciona “Abrir en navegador”.</p>
    </section>

    <section class="demo">
      <img id="guideGif" src="abrir-en-navegador.gif" alt="Tutorial abrir en navegador" fetchpriority="high">
      <div class="gif-fallback" id="gifFallback">
        <div>
          <div class="fallback-arrow">↗️</div>
          <div class="fallback-menu">•••</div>
          <strong data-i18n="tapDots">Pulsa los tres puntos</strong>
        </div>
      </div>
      <div class="live"><span data-i18n="guide">GUÍA ANIMADA</span></div>
    </section>

    <section class="steps">
      <div class="step">
        <div class="number">1</div>
        <div>
          <strong data-i18n="step1">Pulsa •••</strong>
          <span data-i18n="topCorner">Esquina superior</span>
        </div>
      </div>
      <div class="step">
        <div class="number">2</div>
        <div>
          <strong id="step2Title">Abrir en navegador</strong>
          <span id="step2Sub">Usa Chrome</span>
        </div>
      </div>
    </section>

    <div class="waiting">
      <div class="spinner"></div>
      <span data-i18n="waiting">Esperando el navegador…</span>
    </div>
  </main>

  <script>
    (function(){
      "use strict";
      var root = document.documentElement;
      var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent || "");
      var dictionaries = {
        es: {name:"Español", secure:"Conexión segura", tapHere:"PULSA AQUÍ", title:"Pulsa ••• y abre en navegador", browser:"Selecciona “Abrir en navegador”.", safari:"Selecciona “Abrir en Safari”.", guide:"GUÍA ANIMADA", tapDots:"Pulsa los tres puntos", step1:"Pulsa •••", topCorner:"Esquina superior", openBrowser:"Abrir en navegador", openSafari:"Abrir en Safari", useChrome:"Usa Chrome", useSafari:"Usa Safari", waiting:"Esperando el navegador…"},
        en: {name:"English", secure:"Secure connection", tapHere:"TAP HERE", title:"Tap ••• and open in browser", browser:"Select “Open in browser”.", safari:"Select “Open in Safari”.", guide:"ANIMATED GUIDE", tapDots:"Tap the three dots", step1:"Tap •••", topCorner:"Top corner", openBrowser:"Open in browser", openSafari:"Open in Safari", useChrome:"Use Chrome", useSafari:"Use Safari", waiting:"Waiting for browser…"},
        pt: {name:"Português", secure:"Conexão segura", tapHere:"TOQUE AQUI", title:"Toque em ••• e abra no navegador", browser:"Selecione “Abrir no navegador”.", safari:"Selecione “Abrir no Safari”.", guide:"GUIA ANIMADO", tapDots:"Toque nos três pontos", step1:"Toque em •••", topCorner:"Canto superior", openBrowser:"Abrir no navegador", openSafari:"Abrir no Safari", useChrome:"Use o Chrome", useSafari:"Use o Safari", waiting:"Aguardando o navegador…"},
        fr: {name:"Français", secure:"Connexion sécurisée", tapHere:"APPUYEZ ICI", title:"Appuyez sur ••• et ouvrez dans le navigateur", browser:"Sélectionnez « Ouvrir dans le navigateur ».", safari:"Sélectionnez « Ouvrir dans Safari ».", guide:"GUIDE ANIMÉ", tapDots:"Appuyez sur les trois points", step1:"Appuyez sur •••", topCorner:"Coin supérieur", openBrowser:"Ouvrir dans le navigateur", openSafari:"Ouvrir dans Safari", useChrome:"Utilisez Chrome", useSafari:"Utilisez Safari", waiting:"En attente du navigateur…"},
        id: {name:"Indonesia", secure:"Koneksi aman", tapHere:"KETUK DI SINI", title:"Ketuk ••• lalu buka di browser", browser:"Pilih “Buka di browser”.", safari:"Pilih “Buka di Safari”.", guide:"PANDUAN ANIMASI", tapDots:"Ketuk tiga titik", step1:"Ketuk •••", topCorner:"Sudut atas", openBrowser:"Buka di browser", openSafari:"Buka di Safari", useChrome:"Gunakan Chrome", useSafari:"Gunakan Safari", waiting:"Menunggu browser…"},
        fil: {name:"Filipino", secure:"Ligtas na koneksyon", tapHere:"I-TAP DITO", title:"I-tap ang ••• at buksan sa browser", browser:"Piliin ang “Open in browser”.", safari:"Piliin ang “Open in Safari”.", guide:"ANIMATED NA GABAY", tapDots:"I-tap ang tatlong tuldok", step1:"I-tap ang •••", topCorner:"Itaas na sulok", openBrowser:"Open in browser", openSafari:"Open in Safari", useChrome:"Gamitin ang Chrome", useSafari:"Gamitin ang Safari", waiting:"Hinihintay ang browser…"}
      };
      function detectLanguage(){
        var list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "es"];
        for(var i=0; i<list.length; i++){
          var code = String(list[i]).toLowerCase().split("-")[0];
          if(code === "tl") code = "fil";
          if(dictionaries[code]) return code;
        }
        return "es";
      }
      var language = detectLanguage(), t = dictionaries[language];
      root.lang = language;
      root.dataset.language = language;
      document.querySelectorAll("[data-i18n]").forEach(function(el){
        var key = el.dataset.i18n;
        if(t[key]) el.textContent = t[key];
      });
      document.getElementById("languageName").textContent = t.name;
      document.getElementById("subtitle").textContent = isIOS ? t.safari : t.browser;
      document.getElementById("step2Title").textContent = isIOS ? t.openSafari : t.openBrowser;
      document.getElementById("step2Sub").textContent = isIOS ? t.useSafari : t.useChrome;
      
      var gif = document.getElementById("guideGif");
      gif.addEventListener("error", function(){
        gif.style.display = "none";
        document.getElementById("gifFallback").classList.add("show");
      });
      setTimeout(function(){
        if(root.classList.contains("external")){
          document.body.style.visibility = "visible";
          document.getElementById("guide").style.display = "none";
          document.getElementById("redirectFallback").style.display = "flex";
        }
      }, 800);
    })();
  </script>
</body>
</html>
